<style>
:root{
  --paper:#E9EAE4;
  --card:#F6F6F2;
  --ink:#1A2430;
  --ink-2:#4A5765;
  --ink-3:#7C8794;
  --rule:#C9CCC2;
  --seal:#AE3B2C;
  --ochre:#9B7B25;
  --pine:#2C6357;
  --shadow:rgba(26,36,48,.09);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"PingFang TC","PingFang SC",-apple-system,BlinkMacSystemFont,"Heiti TC","Microsoft JhengHei",sans-serif;
  font-size:15px;line-height:1.65;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
.mincho{font-family:"Songti TC","STSong","Songti SC","Noto Serif TC",serif}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}

/* ---------- masthead ---------- */
header.mast{
  background:var(--ink);color:var(--card);
  padding:22px 0 18px;
  border-bottom:3px double var(--seal);
}
.mast h1{
  margin:0;font-size:25px;font-weight:600;letter-spacing:.14em;
  font-family:"Songti TC","STSong",serif;
}
.mast .sub{margin:5px 0 0;font-size:12.5px;color:#9BA7B4;letter-spacing:.05em}
.tally{display:flex;gap:0;margin-top:16px;border:1px solid #38434F}
.tally div{flex:1;padding:9px 6px;text-align:center;border-right:1px solid #38434F}
.tally div:last-child{border-right:0}
.tally b{display:block;font-size:20px;font-weight:500;letter-spacing:.02em;
  font-family:ui-monospace,"SF Mono",Menlo,monospace}
.tally span{font-size:10.5px;color:#8D99A6;letter-spacing:.12em}

/* ---------- caveat ---------- */
.caveat{
  background:#F6E9E4;border-left:3px solid var(--seal);
  padding:11px 13px;margin:14px 0 0;font-size:12.5px;line-height:1.6;color:#5C3A33;
}
.caveat b{color:var(--seal)}

/* ---------- tabs ---------- */
nav.tabs{display:flex;gap:0;margin:16px 0 0;border-bottom:1px solid var(--rule)}
nav.tabs button{
  flex:1;background:none;border:0;padding:10px 4px 9px;font-size:14px;color:var(--ink-3);
  font-family:inherit;letter-spacing:.08em;cursor:pointer;border-bottom:2px solid transparent;
}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--seal);font-weight:600}

/* ---------- filters ---------- */
.filters{padding:14px 0 4px}
.frow{margin-bottom:11px}
.flabel{
  font-size:10.5px;letter-spacing:.18em;color:var(--ink-3);margin-bottom:6px;
  display:flex;align-items:center;gap:7px;
}
.flabel::after{content:"";flex:1;height:1px;background:var(--rule)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--rule);background:var(--card);color:var(--ink-2);
  padding:5px 11px;font-size:13px;font-family:inherit;cursor:pointer;
  border-radius:2px;transition:none;
}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip.seal[aria-pressed="true"]{background:var(--seal);border-color:var(--seal)}
.search{position:relative;margin:2px 0 12px}
.search input{
  width:100%;padding:9px 34px 9px 11px;font-size:15px;font-family:inherit;
  border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:2px;
}
.search input::placeholder{color:var(--ink-3)}
.search button{
  position:absolute;right:2px;top:50%;transform:translateY(-50%);
  background:none;border:0;color:var(--ink-3);font-size:19px;line-height:1;
  padding:4px 9px;cursor:pointer;font-family:inherit;
}
mark{background:#F2E3B8;color:var(--ink);padding:0 1px}
.bar{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:11px 0 12px;border-top:1px solid var(--rule);margin-top:6px;
}
.count{font-size:13px;color:var(--ink-2)}
.count b{font-size:19px;font-weight:500;color:var(--ink)}
.linkbtn{background:none;border:0;color:var(--pine);font-size:13px;font-family:inherit;
  cursor:pointer;padding:2px 0;border-bottom:1px solid var(--pine)}

/* ---------- case card ---------- */
.case{
  background:var(--card);border:1px solid var(--rule);
  margin-bottom:11px;box-shadow:0 1px 0 var(--shadow);
}
.chead{display:flex;align-items:stretch;border-bottom:1px solid var(--rule)}
.grade{

}
.grade .g{font-size:27px;line-height:1;font-weight:500;
  font-family:"Songti TC","STSong",serif;color:var(--ink)}
.grade .gl{font-size:9px;letter-spacing:.12em;color:var(--ink-3);margin-top:4px}
.grade.na .g{font-size:15px;color:var(--ink-3);padding:6px 0}
.cmeta{flex:1;padding:8px 11px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pill{font-size:11.5px;padding:2px 7px;border:1px solid var(--rule);color:var(--ink-2);border-radius:2px}
.pill.yr{border-color:var(--ink-2);color:var(--ink)}
.pill.ex{border-color:var(--ochre);color:var(--ochre)}
.seal{
  margin-left:auto;font-family:"Songti TC","STSong",serif;font-size:12.5px;
  color:var(--seal);border:1.5px solid var(--seal);border-radius:3px;
  padding:3px 7px;letter-spacing:.14em;line-height:1.15;text-align:center;
}
.seal.no{color:var(--ink-3);border-color:var(--ink-3)}
.cid{font-size:10px;color:var(--ink-3);letter-spacing:.06em;font-family:ui-monospace,monospace}

.sec{padding:10px 12px;border-bottom:1px dotted var(--rule)}
.sec:last-child{border-bottom:0}
.sh{font-size:10.5px;letter-spacing:.16em;color:var(--ink-3);margin-bottom:6px}
ol.dv{margin:0;padding:0;list-style:none;counter-reset:dv}
ol.dv li{
  counter-increment:dv;font-size:13.5px;line-height:1.6;padding-left:19px;position:relative;
  margin-bottom:2px;color:var(--ink);
}
ol.dv li::before{
  content:counter(dv);position:absolute;left:0;top:.28em;font-size:10px;
  color:var(--seal);font-family:ui-monospace,monospace;
}
table.gr{width:100%;border-collapse:collapse;font-size:13px}
table.gr th{

  padding:3px 8px 3px 0;vertical-align:top;white-space:nowrap;
}
table.gr td{padding:3px 0;vertical-align:top;color:var(--ink)}
.other{font-size:13.5px;color:var(--ink)}
.other.none{color:var(--ink-3);font-size:12.5px}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;background:#EFEFE9}
.tag{font-size:11px;color:var(--pine);border:1px solid #BFCCC7;padding:1px 6px;border-radius:2px;background:#F6F6F2}

.report{padding:16px 0 40px}

.scope{font-size:12px;color:var(--ink-3);margin:0 0 2px;letter-spacing:.04em}

.report h2:first-child{margin-top:6px}
.report h3{font-size:14px;letter-spacing:.06em;margin:18px 0 7px;color:var(--ink)}
.report p{font-size:13.5px;color:var(--ink-2);margin:8px 0}
.report .lead{font-size:14px;color:var(--ink)}
.dist{margin:10px 0}
.drow{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:13px}
.dkey{width:60px;flex:0 0 60px;color:var(--ink-2);font-size:12.5px}
.dbar{flex:1;height:17px;background:#DEDFD8;position:relative;overflow:hidden}

.dfill.o{background:var(--ochre)}

table.xt td:first-child,table.xt th:first-child{text-align:left}
table.xt .em{color:var(--seal);font-weight:600}
.note{font-size:12px;color:var(--ink-3);line-height:1.6;margin-top:6px}

footer{

.empty{text-align:center;padding:44px 16px;color:var(--ink-3);font-size:13.5px}
.empty b{display:block;font-family:"Songti TC",serif;font-size:16px;color:var(--ink-2);margin-bottom:6px}
.hidden{display:none}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function buildFilters(){
  const box=$('#filters');
  GROUPS.forEach(g=>{
    const row=el('div','frow');
    row.appendChild(el('div','flabel',g.label));
    const chips=el('div','chips');
    g.opts.forEach(([val,txt])=>{
      const b=el('button','chip'+(g.seal?' seal':''),txt);
      b.setAttribute('aria-pressed','false');
      b.onclick=()=>{
        const set=F[g.k];
        if(set.has(val)){set.delete(val);b.setAttribute('aria-pressed','false')}
        else{set.add(val);b.setAttribute('aria-pressed','true')}
        render();
      };
      chips.appendChild(b);
    });
    row.appendChild(chips);
    box.appendChild(row);
  });
}

const _blob=new WeakMap();
function blob(r){
  let b=_blob.get(r);
  if(b===undefined){b=(r.d.join(' ')+' '+(r.o||'')+' '+r.g.filter(Boolean).join(' ')).toLowerCase();_blob.set(r,b)}
  return b;
}
function hl(txt){
  if(!Q)return document.createTextNode(txt);
  const f=document.createDocumentFragment();
  const low=txt.toLowerCase();let i=0,j;
  while((j=low.indexOf(Q,i))>-1){
    if(j>i)f.appendChild(document.createTextNode(txt.slice(i,j)));
    const m=document.createElement('mark');m.textContent=txt.slice(j,j+Q.length);f.appendChild(m);
    i=j+Q.length;
  }
  f.appendChild(document.createTextNode(txt.slice(i)));
  return f;
}
function match(r){
  if(F.y.size&&!F.y.has(String(r.y)))return false;
  if(F.c.size&&!F.c.has(r.c||'-'))return false;
  if(F.s.size&&!F.s.has(r.s))return false;
  if(F.w.size&&!F.w.has(r.w))return false;
  if(F.a.size&&!F.a.has(r.a?'1':'0'))return false;
  if(F.t.size&&![...F.t].every(t=>r.t.includes(t)))return false;
  if(F.os.size&&![...F.os].some(o=>r.os.includes(o)))return false;
  if(F.md.size&&!F.md.has(r.md))return false;
  if(F.xm.size&&!F.xm.has(r.xm))return false;
  if(Q&&!blob(r).includes(Q))return false;
  return true;
}

  sec.appendChild(ov);
  if(r.md||r.xm){
    const tr2=el('div');tr2.style.marginTop='6px';tr2.style.display='flex';tr2.style.gap='5px';tr2.style.flexWrap='wrap';
    if(r.md)tr2.appendChild(el('span','pill','明道 '+r.md));
    if(r.xm)tr2.appendChild(el('span','pill','曉明 '+r.xm));
    sec.appendChild(tr2);
  }
  c.appendChild(sec);

  if(r.t.length){
    const tr=el('div','tagrow');
    r.t.forEach(t=>tr.appendChild(el('span','tag',t)));
    c.appendChild(tr);
  }
  return c;
}

function render(){
  const rows=DATA.filter(match);
  $('#n').textContent=rows.length;
  const list=$('#list');
  list.textContent='';
  if(!rows.length){
    const e=el('div','empty');
    e.appendChild(el('b',null,'沒有符合的案例'));
    e.appendChild(el('div',null,'試著放寬一兩個條件，或按上方「清除全部條件」重來。'));
    list.appendChild(e);
    return;
  }
  const frag=document.createDocumentFragment();
  rows.forEach(r=>frag.appendChild(card(r)));
  list.appendChild(frag);
}

/* ---------- report ---------- */
function pct(a,b){return b?Math.round(a/b*100):0}
function distRow(parent,key,val,total,cls){
  const row=el('div','drow');
  row.appendChild(el('div','dkey',key));
  const bar=el('div','dbar');
  const fill=el('div','dfill'+(cls?' '+cls:''));
  fill.style.width=pct(val,total)+'%';
  bar.appendChild(fill);
  row.appendChild(bar);
  row.appendChild(el('div','dnum',val+' ('+pct(val,total)+'%)'));
  parent.appendChild(row);
}
let SCOPE='all';
function buildReport(){
  const R=$('#reportBody');
  R.textContent='';
  const y115=DATA.filter(r=>r.y===115), y114=DATA.filter(r=>r.y===114);
  const all = SCOPE==='115'?y115 : SCOPE==='114'?y114 : DATA;
  const both = SCOPE==='all';
  const label = both?'兩個學年度合計':SCOPE+' 學年度';

  const sc=el('p','scope','目前範圍：'+label+'　共 '+all.length+' 筆');
  R.appendChild(sc);

  R.appendChild(el('h2',null,'這份資料能回答什麼'));
  const p1=el('p','lead');
  const okN=all.filter(r=>r.w==='錄取').length;
  p1.textContent=all.length+' 位家長寫下孩子的營隊成績、五項多元表現、三學期校內成績，以及衛道和其他學校的結果。其中 '+okN+' 筆錄取。分享的家長不等於全部報考的人，這個比例不是官方錄取率。';
  R.appendChild(p1);

  /* ---- 營隊成績分布 ---- */
  R.appendChild(el('h2',null,'營隊成績分布'));
  R.appendChild(el('p',null,'營隊成績是衛道在營隊期間給的評等。'+(both?'兩個學年度的分布差異不小。':'')));
  const sets = both?[['115 學年度',y115],['114 學年度',y114]]:[[label,all]];
  sets.forEach(([lab,set])=>{
    if(both)R.appendChild(el('h3',null,lab+'（'+set.length+' 筆）'));
    const d=el('div','dist');
    ['A','B','C','D'].forEach((g,i)=>distRow(d,g,set.filter(r=>r.c===g).length,set.length,['','o','p','s'][i]));
    const na=set.filter(r=>!r.c).length;
    if(na)distRow(d,'未填',na,set.length);
    R.appendChild(d);
  });
  const n1=el('p','note');
  if(both){
    n1.textContent='115 學年度 A 佔 '+pct(y115.filter(r=>r.c==='A').length,y115.length)+'%，114 學年度只有 '+pct(y114.filter(r=>r.c==='A').length,y114.length)+'%，B 反而最多。兩年評分寬嚴不同，跨年度比較營隊成績時要留意。';
  }else{
    const other = SCOPE==='115'?y114:y115, oname = SCOPE==='115'?'114':'115';
    n1.textContent=SCOPE+' 學年度 A 佔 '+pct(all.filter(r=>r.c==='A').length,all.length)+'%，'+oname+' 學年度是 '+pct(other.filter(r=>r.c==='A').length,other.length)+'%。兩年評分寬嚴不同，別直接拿另一年的營隊成績來對照。';
  }
  R.appendChild(n1);

  /* ---- 交叉表 ---- */
  R.appendChild(el('h2',null,'營隊成績與衛道結果'));
  R.appendChild(el('p',null,'把營隊成績和最後結果交叉來看。分母是有填該項的筆數。'));
  const t=el('table','xt');
  const hd=el('tr');
  ['營隊成績','筆數','錄取','未錄取／備取'].forEach(h=>hd.appendChild(el('th',null,h)));
  t.appendChild(hd);
  ['A','B','C','D'].forEach(g=>{
    const set=all.filter(r=>r.c===g);
    if(!set.length)return;
    const ok=set.filter(r=>r.w==='錄取').length;
    const tr=el('tr');
    tr.appendChild(el('td',null,g));
    tr.appendChild(el('td',null,String(set.length)));
    tr.appendChild(el('td','em',ok+'（'+pct(ok,set.length)+'%）'));
    tr.appendChild(el('td',null,String(set.length-ok)));
    t.appendChild(tr);
  });
  R.appendChild(t);
  const dSet=all.filter(r=>r.c==='D'), dOk=dSet.filter(r=>r.w==='錄取').length;
  const n2=el('p','note');
  n2.textContent=(dSet.length? '值得注意的是 D 也有 '+dOk+' 筆錄取，營隊成績不是唯一關卡。':'')+'各等第的樣本數差距很大，D 只有 '+dSet.length+' 筆，比例僅供參考。';
  R.appendChild(n2);

  /* ---- 校內成績 ---- */
  R.appendChild(el('h2',null,'校內成績'));
  const ex=all.filter(r=>r.a).length;
  R.appendChild(el('p',null,'五上、五下、六上三個學期全部「優」的有 '+ex+' 筆，佔 '+pct(ex,all.length)+'%。也就是說，有 '+(all.length-ex)+' 筆（'+pct(all.length-ex,all.length)+'%）成績單上出現過甲或乙，一樣進得去。'));
  const d2=el('div','dist');
  distRow(d2,'三學期全優',ex,all.length);
  distRow(d2,'有甲或乙',all.length-ex,all.length,'o');
  R.appendChild(d2);
  if(both){
    const e1=pct(y115.filter(r=>r.a).length,y115.length), e2=pct(y114.filter(r=>r.a).length,y114.length);
    R.appendChild(el('p','note','分開看：115 學年度 '+e1+'% 全優，114 學年度 '+e2+'%。'));
  }
  R.appendChild(el('p','note','出現甲的科目以藝術、音樂、健康與體育、本土語文最常見，主科掛甲的相對少。想估自己孩子的位置時，可以到「逐筆查看」用「校內成績」篩選器只看非全優的案例。'));

  /* ---- 多元表現 ---- */
  R.appendChild(el('h2',null,'多元表現準備了什麼'));
  R.appendChild(el('p',null,'每位家長列五項。把 '+all.length+' 筆的內容分類後，出現頻率如下。'));
  const tags=['英文檢定','中文檢定','服務品格','語文表現','藝術才能','數學競賽','科學資訊','體育'];
  const ranked=tags.map(t=>[t,all.filter(r=>r.t.includes(t)).length]).sort((a,b)=>b[1]-a[1]);
  const d3=el('div','dist');
  const cls=['','','p','','o','s','p','o'];
  ranked.forEach(([t,v],i)=>distRow(d3,t,v,all.length,cls[i]));
  R.appendChild(d3);
  R.appendChild(el('p','note','英文檢定和中文檢定幾乎是標配。差異拉開的地方在後面幾項——數學競賽、科學資訊、藝術才能這三類，有和沒有的差別比較明顯。到「逐筆查看」可以複選類型，找出組合和你家孩子相近的案例。'));

  /* ---- 他校 ---- */
  R.appendChild(el('h2',null,'同時報了哪些學校'));
  const os=['明道','曉明','弘文','明德','華盛頓','立人','新民'];
  const only=all.filter(r=>r.os.includes('僅報衛道')).length;
  R.appendChild(el('p',null,'在「其他學校入學表現狀況」裡提到的學校。有 '+only+' 筆寫明只報衛道。'));
  const d4=el('div','dist');
  os.forEach((s,i)=>distRow(d4,s,all.filter(r=>r.os.includes(s)).length,all.length,['','s','p','o','p','o','s'][i]));
  distRow(d4,'只報衛道',only,all.length);
  R.appendChild(d4);
  R.appendChild(el('p','note','明道是最常見的同時報考對象，其次是曉明。'));

  /* ---- 等第 ---- */
  R.appendChild(el('h2',null,'明道與曉明的等第'));
  const mdN=all.filter(r=>r.md).length, xmN=all.filter(r=>r.xm).length;
  R.appendChild(el('p',null,'有寫出明道等第的 '+mdN+' 筆、曉明等第的 '+xmN+' 筆。可以拿來對照自己孩子在別校拿到的等第，大致落在哪個位置。'));
  if(mdN){
    R.appendChild(el('h3',null,'明道'));
    const d5=el('div','dist');
    ['金盾','銀盾','粉盾'].forEach((g,i)=>distRow(d5,g,all.filter(r=>r.md===g).length,mdN,['o','','p'][i]));
    R.appendChild(d5);
  }
  if(xmN){
    R.appendChild(el('h3',null,'曉明'));
    const d6=el('div','dist');
    ['金質','銀質','銅質','優質','優良'].forEach((g,i)=>distRow(d6,g,all.filter(r=>r.xm===g).length,xmN,['o','','p','s',''][i]));
    R.appendChild(d6);
  }
  R.appendChild(el('p','note','少數家長寫「明道銀質獎」，明道的等第實際是盾，此處併入銀盾計算。另有幾筆只寫「明道錄取」沒有等第，不列入上面的分母。'));

  /* ---- 限制 ---- */
  R.appendChild(el('h2',null,'資料怎麼來的、有哪些限制'));
  R.appendChild(el('p',null,'內容整理自「衛了孩子」多元入學群組記事本的家長留言，逐筆核對後移除所有暱稱與學校名稱。三個要記得的限制：'));
  [
   '一、未錄取的樣本只有 11 筆，要看「沒上的孩子條件如何」樣本太少。',
   '二、內容是家長自己寫的，格式和詳細程度不一。有人寫「全優」，有人逐科列出來；有人五項寫滿，有人只寫三項。',
   '三、兩個學年度的營隊評分標準似乎不同，跨年度比較營隊成績要謹慎。'
  ].forEach(x=>{const q=el('p',null,x);q.style.fontSize='13px';R.appendChild(q)});
}

/* ---------- init ---------- */
document.querySelectorAll('nav.tabs button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('nav.tabs button').forEach(x=>x.setAttribute('aria-selected',String(x===b)));
    const rep=b.dataset.view==='report';
    $('#viewBrowse').classList.toggle('hidden',rep);
    $('#viewReport').classList.toggle('hidden',!rep);
    window.scrollTo({top:0});
  };
});
const qEl=$('#q'),qC=$('#qclear');
let qT;
qEl.addEventListener('input',()=>{
  clearTimeout(qT);
  qT=setTimeout(()=>{Q=qEl.value.trim().toLowerCase();qC.classList.toggle('hidden',!Q);render()},140);
});
qC.onclick=()=>{qEl.value='';Q='';qC.classList.add('hidden');render();qEl.focus()};
$('#reset').onclick=()=>{
  Object.values(F).forEach(s=>s.clear());
  qEl.value='';Q='';qC.classList.add('hidden');
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false'));
  render();
};
document.querySelectorAll('#yrswitch button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#yrswitch button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    SCOPE=b.dataset.yr;
    buildReport();
    $('#viewReport').scrollIntoView({block:'start'});
  };
});
$('#tTotal').textContent=DATA.length;
$('#t115').textContent=DATA.filter(r=>r.y===115).length;
$('#t114').textContent=DATA.filter(r=>r.y===114).length;
buildFilters();
buildReport();
render();
</script>
